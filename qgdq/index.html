<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="你好，且观灯檠大人 —— 一盏青灯，照见今宵。" />
    <meta name="theme-color" content="#0ABAB5" />
    <link rel="icon" href="../resources/www_logo.png" type="image/png" />
    <title>你好，且观灯檠大人</title>
    <style>
        :root {
            --tiffany: #0ABAB5;
            --tiffany-deep: #07827E;
            --tiffany-soft: #81D8D0;
            --tiffany-mist: #E4F7F5;
            --flame: #FFD79A;
            --flame-core: #FFF3D6;
            --bg: #EEF9F8;
            --bg-2: #FFFFFF;
            --ink: #06373A;
            --muted: rgba(6, 55, 58, 0.66);
            --line: rgba(10, 186, 181, 0.28);
            --panel: rgba(255, 255, 255, 0.66);
            --panel-line: rgba(255, 255, 255, 0.86);
            --shadow: 0 26px 60px rgba(4, 74, 76, 0.16);
            --glow: rgba(10, 186, 181, 0.34);
            --radius: 22px;
        }

        html[data-theme='dark'] {
            --tiffany: #3FE0D8;
            --tiffany-deep: #7FF0E9;
            --tiffany-soft: #2AA9A4;
            --tiffany-mist: #0B2E30;
            --bg: #04181B;
            --bg-2: #072125;
            --ink: #E7FBF9;
            --muted: rgba(231, 251, 249, 0.68);
            --line: rgba(63, 224, 216, 0.24);
            --panel: rgba(255, 255, 255, 0.05);
            --panel-line: rgba(255, 255, 255, 0.10);
            --shadow: 0 26px 70px rgba(0, 0, 0, 0.44);
            --glow: rgba(63, 224, 216, 0.30);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(1100px 620px at 50% -12%, var(--glow), transparent 60%),
                radial-gradient(760px 520px at 88% 108%, rgba(129, 216, 208, 0.30), transparent 62%),
                linear-gradient(180deg, var(--bg-2), var(--bg));
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            transition: background-color .5s ease, color .5s ease;
        }

        .motes {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 2px 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            letter-spacing: .08em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .brand-mark {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            object-fit: cover;
            box-shadow: 0 4px 12px var(--glow);
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid var(--panel-line);
            background: var(--panel);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: transform .16s ease, background .16s ease, border-color .16s ease;
        }

        .theme-btn:hover {
            transform: translateY(-1px);
            border-color: var(--tiffany);
        }

        .theme-btn[hidden] {
            display: none;
        }

        .theme-tip {
            position: fixed;
            top: 62px;
            right: 22px;
            z-index: 5;
            color: var(--muted);
            font-size: 12px;
            opacity: 0;
            transform: translateY(-3px);
            transition: opacity .18s ease, transform .18s ease;
            pointer-events: none;
        }

        .theme-tip.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 主舞台 ---------- */
        .stage {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            align-items: center;
            gap: 26px;
            margin-top: 26px;
            padding: 34px 34px 38px;
            border: 1px solid var(--panel-line);
            border-radius: var(--radius);
            background: linear-gradient(180deg, var(--panel), transparent 85%);
            box-shadow: var(--shadow);
            -webkit-backdrop-filter: blur(16px) saturate(1.15);
            backdrop-filter: blur(16px) saturate(1.15);
            overflow: hidden;
        }

        .stage::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(420px 300px at 26% 46%, rgba(255, 215, 154, 0), rgba(255, 215, 154, 0));
            transition: background .9s ease;
        }

        body.lit .stage::after {
            background: radial-gradient(420px 320px at 26% 46%, rgba(255, 215, 154, 0.16), rgba(255, 215, 154, 0) 70%);
        }

        /* ---------- 灯檠 ---------- */
        .lamp-wrap {
            position: relative;
            display: grid;
            justify-items: center;
            gap: 12px;
            padding: 8px;
        }

        .lamp {
            width: min(260px, 62vw);
            height: auto;
            cursor: pointer;
            overflow: visible;
            filter: drop-shadow(0 18px 30px rgba(4, 74, 76, 0.18));
        }

        .lamp:focus-visible {
            outline: 2px solid var(--tiffany);
            outline-offset: 8px;
            border-radius: 16px;
        }

        .halo {
            opacity: 0;
            transition: opacity 1s ease;
        }

        body.lit .halo {
            opacity: 1;
        }

        .flame {
            opacity: 0;
            transform: scale(.55) translateY(10px);
            transform-origin: 100px 132px;
            transition: opacity .5s ease, transform .6s cubic-bezier(.22, 1.2, .36, 1);
        }

        body.lit .flame {
            opacity: 1;
            transform: scale(1) translateY(0);
            animation: flicker 2.6s ease-in-out infinite;
        }

        .flame-core {
            opacity: 0;
            transition: opacity .5s ease .1s;
        }

        body.lit .flame-core {
            opacity: .9;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) translateY(0); opacity: 1; }
            38% { transform: scale(1.05, .96) translateY(-1px); opacity: .94; }
            62% { transform: scale(.97, 1.05) translateY(0); opacity: 1; }
        }

        .lamp-hint {
            font-size: 12.5px;
            color: var(--muted);
            letter-spacing: .04em;
        }

        /* SVG 配色：交由样式表承载，保证 CSS 变量在深浅色下即时生效 */
        .halo-a { stop-color: var(--flame); }
        .halo-b { stop-color: var(--tiffany); }
        .metal-1 { stop-color: var(--tiffany-soft); }
        .metal-2 { stop-color: var(--tiffany); }
        .metal-3 { stop-color: var(--tiffany-deep); }
        .flame-1 { stop-color: var(--tiffany-soft); }
        .flame-2 { stop-color: var(--flame); }
        .flame-3 { stop-color: var(--flame-core); }
        .fill-tiffany { fill: var(--tiffany); }
        .fill-deep { fill: var(--tiffany-deep); }
        .fill-surface { fill: var(--bg-2); }
        .fill-flame-core { fill: var(--flame-core); }
        .stroke-deep { stroke: var(--tiffany-deep); }

        /* ---------- 问候语 ---------- */
        .greeting {
            min-width: 0;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            color: var(--tiffany-deep);
            font-size: 12.5px;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--tiffany);
            box-shadow: 0 0 0 4px var(--glow);
        }

        h1 {
            margin: 18px 0 0;
            font-size: clamp(30px, 5.4vw, 54px);
            line-height: 1.16;
            letter-spacing: .02em;
            font-weight: 750;
            background: linear-gradient(96deg, var(--tiffany-deep), var(--tiffany) 46%, var(--tiffany-soft));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            min-height: 1.2em;
        }

        .caret {
            display: inline-block;
            width: 3px;
            height: .92em;
            margin-left: 4px;
            vertical-align: -0.08em;
            border-radius: 2px;
            background: var(--tiffany);
            animation: blink 1.05s steps(1) infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .lead {
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.9;
            max-width: 46ch;
        }

        .blessing {
            margin-top: 22px;
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(180deg, var(--panel), transparent);
            min-height: 92px;
            display: grid;
            align-content: center;
            gap: 6px;
        }

        .blessing-label {
            font-size: 11.5px;
            letter-spacing: .22em;
            color: var(--tiffany-deep);
            text-transform: uppercase;
        }

        .blessing-text {
            font-size: clamp(16px, 2.4vw, 19px);
            line-height: 1.7;
            color: var(--ink);
            transition: opacity .32s ease, transform .32s ease;
        }

        .blessing-text.is-fading {
            opacity: 0;
            transform: translateY(6px);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            appearance: none;
            border-radius: 999px;
            padding: 12px 22px;
            font-size: 14.5px;
            font-family: inherit;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
        }

        .btn-primary {
            border: none;
            color: #04302F;
            background: linear-gradient(120deg, var(--tiffany-soft), var(--tiffany));
            box-shadow: 0 12px 26px var(--glow);
            font-weight: 650;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px var(--glow);
        }

        .btn-ghost {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
        }

        .btn-ghost:hover {
            transform: translateY(-2px);
            border-color: var(--tiffany);
            color: var(--tiffany-deep);
        }

        .btn:active {
            transform: translateY(0) scale(.98);
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: 30px;
            padding: 22px 18px 10px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.9;
        }

        .footer .rule {
            width: 54px;
            height: 3px;
            margin: 0 auto 18px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--tiffany-soft), var(--tiffany));
        }

        .copyright {
            color: var(--ink);
            font-size: 13.5px;
        }

        .footer a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--line);
        }

        .footer a:hover {
            color: var(--tiffany-deep);
            text-decoration-color: var(--tiffany);
        }

        .license {
            margin: 4px 0 0;
            font-size: 12.5px;
        }

        .footer-icp {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .moe-icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 820px) {
            .stage {
                grid-template-columns: minmax(0, 1fr);
                text-align: center;
                padding: 26px 20px 30px;
            }

            .lamp-wrap { order: -1; }
            .lead { margin-left: auto; margin-right: auto; }
            .eyebrow { justify-content: center; }
            .actions { justify-content: center; }
            body.lit .stage::after {
                background: radial-gradient(340px 260px at 50% 22%, rgba(255, 215, 154, 0.16), transparent 70%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>
    <canvas class="motes" id="motes" aria-hidden="true"></canvas>

    <main class="page">
        <header class="topbar">
            <span class="brand">
                <img class="brand-mark" src="../resources/www_logo.png" alt="YIMC Logo" />
                YIMC · 且观灯檠
            </span>
            <div class="theme-switch" aria-label="主题切换">
                <button class="theme-btn" type="button" data-theme-toggle aria-label="切换主题" title="切换主题">☀︎</button>
                <button class="theme-btn" type="button" data-theme-reset aria-label="恢复自动" title="恢复自动"
                    hidden>↩︎</button>
            </div>
        </header>
        <div class="theme-tip" data-theme-tip aria-live="polite"></div>

        <section class="stage">
            <div class="lamp-wrap">
                <svg class="lamp" id="lamp" viewBox="0 0 200 300" role="button" tabindex="0"
                    aria-label="点亮或熄灭灯檠" aria-pressed="false" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
                            <stop class="halo-a" offset="0%" stop-opacity=".55" />
                            <stop class="halo-b" offset="45%" stop-opacity=".26" />
                            <stop class="halo-b" offset="100%" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
                            <stop class="metal-1" offset="0%" />
                            <stop class="metal-2" offset="52%" />
                            <stop class="metal-3" offset="100%" />
                        </linearGradient>
                        <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop class="flame-1" offset="0%" stop-opacity=".85" />
                            <stop class="flame-2" offset="42%" />
                            <stop class="flame-3" offset="100%" />
                        </linearGradient>
                    </defs>

                    <circle class="halo" cx="100" cy="150" r="96" fill="url(#haloGrad)" />

                    <!-- 灯座 -->
                    <ellipse cx="100" cy="276" rx="66" ry="14" fill="url(#metal)" opacity=".9" />
                    <ellipse class="fill-deep" cx="100" cy="270" rx="52" ry="11" opacity=".35" />
                    <path d="M74 270 q26 -14 52 0 q-26 8 -52 0 z" fill="url(#metal)" opacity=".75" />

                    <!-- 灯柱 -->
                    <rect x="94" y="160" width="12" height="108" rx="6" fill="url(#metal)" />
                    <ellipse class="fill-tiffany" cx="100" cy="216" rx="17" ry="6" opacity=".55" />
                    <ellipse class="fill-tiffany" cx="100" cy="188" rx="14" ry="5" opacity=".45" />
                    <ellipse class="fill-tiffany" cx="100" cy="244" rx="20" ry="6" opacity=".4" />

                    <!-- 灯盏 -->
                    <path d="M46 150 q54 42 108 0 q-12 30 -54 30 q-42 0 -54 -30 z" fill="url(#metal)" />
                    <ellipse class="fill-surface" cx="100" cy="150" rx="54" ry="11" opacity=".55" />
                    <ellipse class="stroke-deep" cx="100" cy="150" rx="54" ry="11" fill="none"
                        stroke-opacity=".45" stroke-width="1.5" />

                    <!-- 灯芯与火焰 -->
                    <rect class="fill-deep" x="98" y="130" width="4" height="20" rx="2" opacity=".7" />
                    <path class="flame" d="M100 62 C114 88 126 100 126 116 a26 26 0 0 1 -52 0 C74 100 86 88 100 62 z"
                        fill="url(#flameGrad)" />
                    <path class="flame-core fill-flame-core"
                        d="M100 92 C108 106 112 112 112 120 a12 12 0 0 1 -24 0 C88 112 92 106 100 92 z"
                        opacity=".9" />
                </svg>
                <span class="lamp-hint" id="lamp-hint">轻触灯檠 · 点亮今宵</span>
            </div>

            <div class="greeting">
                <span class="eyebrow">A Greeting, Lit by Tiffany Blue</span>
                <h1 aria-label="你好，且观灯檠大人"><span class="typed" id="typed">你好，且观灯檠大人</span><span
                        class="caret" aria-hidden="true"></span></h1>
                <p class="lead">
                    以青碧为夜，以一檠为约。此地无长亭古道，只备下一盏不熄的灯，
                    待大人抬步而来，便有光替我说：欢迎光临。
                </p>

                <div class="blessing" aria-live="polite">
                    <span class="blessing-label">灯下寄语</span>
                    <span class="blessing-text" id="blessing">灯火可亲，山海可平。</span>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" id="toggle-lamp" type="button" aria-pressed="false">点亮灯檠</button>
                    <button class="btn btn-ghost" id="next-blessing" type="button">换一句寄语</button>
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="rule" aria-hidden="true"></div>
            <div class="copyright">
                &copy; 2026 <a href="https://tianyimc.com/">tianyimc.com</a> · 著作权所有 · All Rights Reserved
            </div>
            <div class="footer-icp">
                <img class="moe-icon" src="../resources/moe_icon120.png" alt="萌ICP备图标" title="萌ICP备图标" />
                <a href="https://icp.gov.moe/?keyword=20251234" rel="noreferrer noopener">萌ICP备20251234号</a>
            </div>
        </footer>
    </main>

    <script src="../js/theme-switch.js"></script>
    <script>
        (function () {
            var reduceMotion = window.matchMedia
                ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
                : false;

            /* ---------- 状态 ---------- */
            var body = document.body;
            var lamp = document.getElementById('lamp');
            var lampHint = document.getElementById('lamp-hint');
            var toggleBtn = document.getElementById('toggle-lamp');
            var typed = document.getElementById('typed');
            var blessingEl = document.getElementById('blessing');
            var nextBtn = document.getElementById('next-blessing');

            /* 页面载入时自动点灯，营造“迎客”的仪式感 */
            window.requestAnimationFrame(function () {
                setLit(true);
            });

            function setLit(lit) {
                body.classList.toggle('lit', lit);
                lamp.setAttribute('aria-pressed', String(lit));
                toggleBtn.setAttribute('aria-pressed', String(lit));
                toggleBtn.textContent = lit ? '吹熄灯檠' : '点亮灯檠';
                lampHint.textContent = lit ? '灯火正明 · 愿君欢喜' : '轻触灯檠 · 点亮今宵';
            }

            toggleBtn.addEventListener('click', function () {
                setLit(!body.classList.contains('lit'));
            });

            lamp.addEventListener('click', function () {
                setLit(!body.classList.contains('lit'));
            });

            lamp.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
                    event.preventDefault();
                    setLit(!body.classList.contains('lit'));
                }
            });

            /* ---------- 灯下寄语 ---------- */
            var blessings = [
                '灯火可亲，山海可平。',
                '以灯为名，以光相迎。',
                '一檠灯火，半卷清风。',
                '愿此间长明，照见所愿皆成。',
                '且观灯影摇青碧，静候故人踏月来。',
                '今夜不谈远方，只谈灯下有你。'
            ];
            var blessingIndex = 0;

            function rotateBlessing(step) {
                blessingIndex = (blessingIndex + step + blessings.length) % blessings.length;
                blessingEl.classList.add('is-fading');
                window.setTimeout(function () {
                    blessingEl.textContent = blessings[blessingIndex];
                    blessingEl.classList.remove('is-fading');
                }, reduceMotion ? 0 : 320);
            }

            nextBtn.addEventListener('click', function () {
                rotateBlessing(1);
            });

            if (!reduceMotion) {
                window.setInterval(function () {
                    rotateBlessing(1);
                }, 7000);
            }

            /* ---------- 标题打字机 ---------- */
            var fullTitle = typed.textContent.trim();
            if (!reduceMotion) {
                typed.textContent = '';
                var cursor = 0;
                var tick = window.setInterval(function () {
                    cursor += 1;
                    typed.textContent = fullTitle.slice(0, cursor);
                    if (cursor >= fullTitle.length) {
                        window.clearInterval(tick);
                    }
                }, 130);
            }

            /* ---------- 背景光尘 ---------- */
            var canvas = document.getElementById('motes');
            var ctx = canvas.getContext ? canvas.getContext('2d') : null;
            if (ctx) {
                var particles = [];
                var count = 46;
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var tint = 'rgba(10,186,181,';
                var warm = 'rgba(255,215,154,';

                function readTint() {
                    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                    tint = dark ? 'rgba(63,224,216,' : 'rgba(10,186,181,';
                }

                function resize() {
                    canvas.width = Math.floor(window.innerWidth * dpr);
                    canvas.height = Math.floor(window.innerHeight * dpr);
                }

                function seed() {
                    particles = [];
                    for (var i = 0; i < count; i += 1) {
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            r: (Math.random() * 1.9 + 0.6) * dpr,
                            vy: (Math.random() * 0.28 + 0.06) * dpr,
                            vx: (Math.random() - 0.5) * 0.18 * dpr,
                            a: Math.random() * 0.5 + 0.18,
                            warm: Math.random() > 0.72
                        });
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (var i = 0; i < particles.length; i += 1) {
                        var p = particles[i];
                        if (!reduceMotion) {
                            p.y -= p.vy;
                            p.x += p.vx;
                            if (p.y < -12) {
                                p.y = canvas.height + 12;
                                p.x = Math.random() * canvas.width;
                            }
                            if (p.x < -12) p.x = canvas.width + 12;
                            if (p.x > canvas.width + 12) p.x = -12;
                        }
                        var color = p.warm && body.classList.contains('lit') ? warm : tint;
                        ctx.beginPath();
                        ctx.fillStyle = color + p.a + ')';
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                function loop() {
                    draw();
                    window.requestAnimationFrame(loop);
                }

                resize();
                seed();
                readTint();
                window.addEventListener('resize', function () {
                    resize();
                    seed();
                });
                if (window.MutationObserver) {
                    new MutationObserver(readTint).observe(document.documentElement, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                }
                if (reduceMotion) {
                    draw();
                } else {
                    loop();
                }
            }
        })();
    </script>
</body>

</html>
